; ==============================================================================
; GTMS Production PHP Runtime Configuration (Synology NAS Edition)
; Optimized for 10GB+ Chunked Uploads & Background Processing
; ==============================================================================

[PHP]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Resource Limits
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
max_execution_time = 300
max_input_time = 300
memory_limit = 512M

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; File Uploads
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
file_uploads = On
upload_max_filesize = 100M
post_max_size = 120M
max_file_uploads = 50

; Direct temporary uploads to persistent NAS mount (Prevents RAM tmpfs overflow)
upload_tmp_dir = /tmp/php_uploads

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Error Handling & Logging
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

output_buffering = 4096
implicit_flush = Off

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; OPcache Tuning
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
