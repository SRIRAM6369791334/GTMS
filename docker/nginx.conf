# ==============================================================================
# GTMS Production Nginx Server Configuration (Synology NAS Edition)
# Optimized for 10GB+ Chunked Streaming & Zero-Timeout Uploads
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/html/public;

    # Production Performance & Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    index index.php index.html;
    charset utf-8;

    # --------------------------------------------------------------------------
    # Buffer and Payload Limits (10GB+ Payload Support)
    # --------------------------------------------------------------------------
    # Unlimited client payload for multi-gigabyte chunked uploads
    client_max_body_size 0;

    # 2MB in-memory buffer before spilling to disk
    client_body_buffer_size 2M;

    # Persistent NAS staging buffer (redirected from container overlay to NAS)
    client_body_temp_path /var/lib/nginx/tmp/client_body 1 2;

    # --------------------------------------------------------------------------
    # Connection Timeouts (Tuned for high-latency cellular quarry uplinks)
    # --------------------------------------------------------------------------
    client_body_timeout 300s;
    client_header_timeout 60s;
    keepalive_timeout 75s;
    send_timeout 300s;

    # --------------------------------------------------------------------------
    # FastCGI Upstream Optimization & Timeouts
    # --------------------------------------------------------------------------
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout 600s;
    fastcgi_read_timeout 600s;
    fastcgi_buffer_size 128k;
    fastcgi_buffers 16 128k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_temp_file_write_size 256k;

    # --------------------------------------------------------------------------
    # Front-Controller Route Handling
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # Dedicated Route for Resumable Chunk & Large File Upload Streaming
    # --------------------------------------------------------------------------
    location ~* ^/(api/)?(upload/chunk|uploads|chunk-upload|drone-survey/upload-chunk) {
        # Unlimited client payload
        client_max_body_size 0;
        client_body_buffer_size 2M;
        client_body_temp_path /var/lib/nginx/tmp/client_body 1 2;
        client_body_timeout 300s;

        # Disable FastCGI request buffering for immediate streaming to PHP-FPM
        fastcgi_request_buffering off;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        fastcgi_ignore_client_abort off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # --------------------------------------------------------------------------
    # Standard PHP-FPM Script Execution
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    # --------------------------------------------------------------------------
    # Static Asset Caching
    # --------------------------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|dwg|dxf|kml|tif|tiff)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
