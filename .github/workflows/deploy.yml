name: Deploy GTMS to Local Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Docker Deployment (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "Primary-PC"
            runner: [self-hosted, Windows]
          - target: "Secondary-PC"
            runner: [self-hosted, Windows]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Docker Availability
        run: |
          docker --version
          docker compose version

      - name: Deploy Containers with Docker Compose
        run: |
          docker compose up -d --build

      - name: Verify Service Health
        shell: powershell
        run: |
          $maxRetries = 15
          $retry = 0
          $success = $false

          Write-Host "Checking application health at http://localhost:8000/up..."

          while ($retry -lt $maxRetries) {
              try {
                  $response = Invoke-WebRequest -Uri "http://localhost:8000/up" -UseBasicParsing -TimeoutSec 5
                  if ($response.StatusCode -eq 200) {
                      Write-Host "Application is HEALTHY (HTTP 200)!"
                      $success = $true
                      break
                  }
              } catch {
                  Write-Host "Waiting for service to be healthy... ($($retry + 1)/$maxRetries)"
                  Start-Sleep -Seconds 3
                  $retry++
              }
          }

          if (-not $success) {
              Write-Error "Deployment failed health check at http://localhost:8000/up"
              exit 1
          }

      - name: Automated Database Backup (Before Migration)
        shell: powershell
        run: |
          $backupDir = "database/backups"
          if (-not (Test-Path $backupDir)) {
              New-Item -ItemType Directory -Path $backupDir -Force | Out-Null
          }
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $backupFile = "$backupDir/gtms_backup_$timestamp.sql"
          Write-Host "Creating safety backup of gtms_data database to $backupFile..."
          
          # Run mysqldump inside MySQL container safely
          cmd /c "docker compose exec -T db mysqldump -u root -proot_secret gtms_data > $backupFile"
          
          if (Test-Path $backupFile) {
              $size = (Get-Item $backupFile).Length
              Write-Host "Database backup successfully created! Size: $size bytes"
          } else {
              Write-Warning "Could not verify backup file creation, continuing with deployment."
          }

      - name: Run Safe Database Migrations & Initial Seeding
        run: |
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan tinker --execute="if (\Illuminate\Support\Facades\DB::table('users')->count() === 0) { \Illuminate\Support\Facades\Artisan::call('db:seed', ['--force' => true]); echo 'Initial seed completed successfully.' . PHP_EOL; } else { echo 'Database already seeded, skipping.' . PHP_EOL; }"

      - name: Clear Blade View & Bootstrap Caches
        run: |
          docker compose exec -T app php artisan optimize:clear

      - name: Deployment Summary
        run: |
          docker compose ps


