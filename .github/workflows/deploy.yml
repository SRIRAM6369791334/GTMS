name: GTMS CI/CD - Build, Test & GHCR Publish

on:
  push:
    branches:
      - main

# Least privilege: default to none, explicitly granted per job
permissions: {}

jobs:
  # ============================================================================
  # JOB 1: Validation & Automated Testing
  # ============================================================================
  validate-and-test:
    name: Validate & Test Codebase
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Validate Composer Configuration
        run: composer validate --strict

      - name: Setup PHP 8.2 Runtime
        # shivammathur/setup-php@v2
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo_mysql, gd, zip
          coverage: none

      - name: Setup Node.js 20 & Compile Frontend Assets
        # actions/setup-node@v4.2.0
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 20
          cache: npm

      - name: Install Frontend Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint PHP Files (Syntax Validation)
        run: |
          echo "Linting PHP codebase syntax..."
          find app config routes tests -type f -name "*.php" -exec php -l {} +

      - name: Verify Laravel Configuration & Route Registration
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          php artisan route:list

      - name: Run Unit Tests
        run: php artisan test --testsuite=Unit

  # ============================================================================
  # JOB 2: Build & Publish Container Image to GitHub Container Registry (GHCR)
  # ============================================================================
  build-and-publish:
    name: Build & Publish GHCR Image
    needs: validate-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@v3.10.0
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Authenticate with GitHub Container Registry (GHCR)
        # docker/login-action@v3.3.0
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        # docker/build-push-action@v6.15.0
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/sriram6369791334/gtms:main
            ghcr.io/sriram6369791334/gtms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
