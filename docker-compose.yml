services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtms_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "${APP_NAME:-GTMS}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:A8G4F7r+xOakTQV7PCxcI37eWgUST8Oc2u924f9lBM0=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-gtms_data}"
      DB_USERNAME: "${DOCKER_DB_USER:-gtms_user}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-gtms_secret}"
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gtms_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: mysql:8.0
    container_name: gtms_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-root_secret}"
      MYSQL_DATABASE: "${DB_DATABASE:-gtms_data}"
      MYSQL_USER: "${DOCKER_DB_USER:-gtms_user}"
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:-gtms_secret}"
    volumes:
      - gtms_mysql_data:/var/lib/mysql
    networks:
      - gtms_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  gtms_mysql_data:
    driver: local
  app_storage:
    driver: local

networks:
  gtms_network:
    driver: bridge
