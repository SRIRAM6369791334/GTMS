services:
  # ============================================================================
  # GTMS Web Application (Nginx + PHP-FPM 8.2 Production Container)
  # ============================================================================
  app:
    image: ghcr.io/sriram6369791334/gtms:${GTMS_IMAGE_TAG:-main}
    container_name: gtms_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-GTMS}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:?APP_KEY must be set in .env}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:?APP_URL must be set in .env (e.g. http://192.168.1.100:8000)}"
      PUID: "${PUID:-1026}"
      PGID: "${PGID:-100}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-gtms_data}"
      DB_USERNAME: "${DOCKER_DB_USER:-gtms_user}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:?DOCKER_DB_PASSWORD must be set in .env}"
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      CHUNKS_STORAGE_PATH: "/var/www/html/storage/app/chunks"
    volumes:
      # Persistent storage on Synology NAS (under ${GTMS_DATA_DIR:-/volume1/docker/gtms-data})
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/storage:/var/www/html/storage"
      # Persistent statutory uploads directory
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/uploads:/var/www/html/public/uploads"
      # Chunk staging directory
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/chunks:/var/www/html/storage/app/chunks"
      # Nginx body temp buffering redirected from container root to NAS
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/nginx-temp:/var/lib/nginx/tmp"
      # PHP upload temp directory redirected from RAM to NAS
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/php-temp:/tmp/php_uploads"
      # Pre-migration safety backups
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/backups:/var/www/html/database/backups"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gtms_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================================
  # Dedicated Asynchronous Queue Worker Container
  # ============================================================================
  queue:
    image: ghcr.io/sriram6369791334/gtms:${GTMS_IMAGE_TAG:-main}
    container_name: gtms_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--queue=uploads,default", "--timeout=3600", "--tries=3", "--memory=1024"]
    environment:
      APP_NAME: "${APP_NAME:-GTMS}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:?APP_KEY must be set in .env}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:?APP_URL must be set in .env}"
      PUID: "${PUID:-1026}"
      PGID: "${PGID:-100}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-gtms_data}"
      DB_USERNAME: "${DOCKER_DB_USER:-gtms_user}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:?DOCKER_DB_PASSWORD must be set in .env}"
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      CHUNKS_STORAGE_PATH: "/var/www/html/storage/app/chunks"
    volumes:
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/storage:/var/www/html/storage"
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/uploads:/var/www/html/public/uploads"
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/chunks:/var/www/html/storage/app/chunks"
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/php-temp:/tmp/php_uploads"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gtms_network

  # ============================================================================
  # In-Memory Cache & Queue Broker (Redis 7) - Private Network Only
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: gtms_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/redis:/data"
    networks:
      - gtms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Relational Database Engine (MySQL 8.0) - Private Network Only (No Host Port)
  # ============================================================================
  db:
    image: mysql:8.0
    container_name: gtms_db
    restart: unless-stopped
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--innodb-buffer-pool-size=4G",
      "--innodb-log-file-size=512M",
      "--max-connections=200"
    ]
    environment:
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:?DOCKER_DB_ROOT_PASSWORD must be set in .env}"
      MYSQL_DATABASE: "${DB_DATABASE:-gtms_data}"
      MYSQL_USER: "${DOCKER_DB_USER:-gtms_user}"
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:?DOCKER_DB_PASSWORD must be set in .env}"
    volumes:
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/mysql:/var/lib/mysql"
      - "${GTMS_DATA_DIR:-/volume1/docker/gtms-data}/backups:/backups"
    networks:
      - gtms_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  gtms_network:
    driver: bridge
